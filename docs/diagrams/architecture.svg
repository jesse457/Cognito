<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">How a request travels</title>
  <desc id="archDesc">The browser and Laravel exchange Inertia pages over HTTPS, the browser talks to LiveKit directly for live media, and Laravel uses PostgreSQL, Redis and object storage.</desc>

  <rect width="1200" height="580" fill="#f1f3f7"/>

  <defs>
    <marker id="archArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7787"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="48" y="54" font-size="28" font-weight="700" fill="#0b0d12">How it runs</text>
    <text x="48" y="82" font-size="15" fill="#4c5563">Laravel renders every page with Inertia. Live media never passes through PHP.</text>

    <!-- Browser -->
    <rect x="48" y="112" width="520" height="168" rx="18" fill="#ffffff" stroke="#e3e6ec"/>
    <text x="72" y="140" font-size="11" font-weight="600" letter-spacing="1.4" fill="#6e7787">BROWSER</text>
    <text x="72" y="170" font-size="18" font-weight="600" fill="#0b0d12">React 19 on Inertia</text>
    <rect x="72" y="186" width="86" height="26" rx="13" fill="#e8edfd"/>
    <text x="115" y="203" font-size="12" fill="#173ab4" text-anchor="middle">React 19</text>
    <rect x="166" y="186" width="84" height="26" rx="13" fill="#e8edfd"/>
    <text x="208" y="203" font-size="12" fill="#173ab4" text-anchor="middle">Inertia 3</text>
    <rect x="258" y="186" width="92" height="26" rx="13" fill="#e8edfd"/>
    <text x="304" y="203" font-size="12" fill="#173ab4" text-anchor="middle">Tailwind 4</text>
    <text x="72" y="240" font-size="13" fill="#4c5563">One component tree for every surface,</text>
    <text x="72" y="260" font-size="13" fill="#4c5563">rendered from a Laravel response.</text>

    <!-- Laravel -->
    <rect x="632" y="112" width="520" height="168" rx="18" fill="#ffffff" stroke="#e3e6ec"/>
    <text x="656" y="140" font-size="11" font-weight="600" letter-spacing="1.4" fill="#6e7787">SERVER</text>
    <text x="656" y="170" font-size="18" font-weight="600" fill="#0b0d12">Laravel 13</text>
    <rect x="656" y="186" width="96" height="26" rx="13" fill="#e8edfd"/>
    <text x="704" y="203" font-size="12" fill="#173ab4" text-anchor="middle">Controllers</text>
    <rect x="760" y="186" width="78" height="26" rx="13" fill="#e8edfd"/>
    <text x="799" y="203" font-size="12" fill="#173ab4" text-anchor="middle">Policies</text>
    <rect x="846" y="186" width="78" height="26" rx="13" fill="#e8edfd"/>
    <text x="885" y="203" font-size="12" fill="#173ab4" text-anchor="middle">Services</text>
    <text x="656" y="240" font-size="13" fill="#4c5563">Form requests validate; policies guard</text>
    <text x="656" y="260" font-size="13" fill="#4c5563">every page, call and file.</text>

    <!-- LiveKit -->
    <rect x="48" y="352" width="520" height="168" rx="18" fill="#ffffff" stroke="#e3e6ec"/>
    <text x="72" y="380" font-size="11" font-weight="600" letter-spacing="1.4" fill="#6e7787">REALTIME</text>
    <text x="72" y="410" font-size="18" font-weight="600" fill="#0b0d12">LiveKit</text>
    <rect x="72" y="426" width="64" height="26" rx="13" fill="#dff4ea"/>
    <text x="104" y="443" font-size="12" fill="#0a6b40" text-anchor="middle">Voice</text>
    <rect x="144" y="426" width="104" height="26" rx="13" fill="#dff4ea"/>
    <text x="196" y="443" font-size="12" fill="#0a6b40" text-anchor="middle">Screen share</text>
    <rect x="256" y="426" width="116" height="26" rx="13" fill="#dff4ea"/>
    <text x="314" y="443" font-size="12" fill="#0a6b40" text-anchor="middle">Board channel</text>
    <text x="72" y="480" font-size="13" fill="#4c5563">Laravel mints a short-lived token; audio, video</text>
    <text x="72" y="500" font-size="13" fill="#4c5563">and ink then travel between browsers directly.</text>

    <!-- Data -->
    <rect x="632" y="352" width="520" height="168" rx="18" fill="#ffffff" stroke="#e3e6ec"/>
    <text x="656" y="380" font-size="11" font-weight="600" letter-spacing="1.4" fill="#6e7787">STORAGE &amp; STATE</text>
    <text x="656" y="410" font-size="18" font-weight="600" fill="#0b0d12">Three private stores</text>
    <rect x="656" y="426" width="98" height="26" rx="13" fill="#fbefda"/>
    <text x="705" y="443" font-size="12" fill="#8d5607" text-anchor="middle">PostgreSQL</text>
    <rect x="762" y="426" width="64" height="26" rx="13" fill="#fbefda"/>
    <text x="794" y="443" font-size="12" fill="#8d5607" text-anchor="middle">Redis</text>
    <rect x="834" y="426" width="88" height="26" rx="13" fill="#fbefda"/>
    <text x="878" y="443" font-size="12" fill="#8d5607" text-anchor="middle">S3 / MinIO</text>
    <text x="656" y="480" font-size="13" fill="#4c5563">Postgres keeps the record, Redis keeps live</text>
    <text x="656" y="500" font-size="13" fill="#4c5563">room state, and files stay behind access checks.</text>

    <!-- Arrows -->
    <line x1="568" y1="196" x2="632" y2="196" stroke="#6e7787" stroke-width="1.5" marker-start="url(#archArrow)" marker-end="url(#archArrow)"/>
    <text x="600" y="184" font-size="10.5" fill="#6e7787" text-anchor="middle">Inertia</text>

    <line x1="308" y1="280" x2="308" y2="352" stroke="#6e7787" stroke-width="1.5" marker-start="url(#archArrow)" marker-end="url(#archArrow)"/>
    <text x="296" y="320" font-size="10.5" fill="#6e7787" text-anchor="end">WebRTC + data channel</text>

    <line x1="892" y1="280" x2="892" y2="352" stroke="#6e7787" stroke-width="1.5" marker-start="url(#archArrow)" marker-end="url(#archArrow)"/>
    <text x="904" y="320" font-size="10.5" fill="#6e7787">SQL · cache · S3</text>

    <text x="48" y="556" font-size="12.5" fill="#6e7787">Nothing private is public: files are streamed through access checks, and a drawing never reaches a database.</text>
  </g>
</svg>
